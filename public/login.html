<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235f7a6e' stroke-width='1.5'><rect x='4' y='10' width='16' height='10' rx='2'/><path d='M8 10V7a4 4 0 0 1 8 0v3'/></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="/css/estilo.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .entrada { width: 100%; max-width: 340px; }
  .entrada h1 { font-size: 1.2rem; margin-bottom: 4px; }
  .entrada .sub { color: var(--apagado); font-size: .85rem; margin-bottom: 26px; }
  .caixa-login {
    background: var(--papel); border: 1px solid var(--linha);
    border-radius: var(--r-g); padding: 24px;
  }
  #alerta { margin-bottom: 16px; display: none; }
  .voltar-site { margin-top: 20px; font-size: .83rem; }
  .voltar-site a { color: var(--apagado); font-weight: 400; }
  .voltar-site a:hover { color: var(--acento-forte); }
</style>
</head>
<body>
  <div class="entrada">
    <h1>Painel do negócio</h1>
    <p class="sub">Entre para administrar sua agenda.</p>

    <div class="caixa-login">
      <div id="alerta" class="aviso"></div>
      <form id="formLogin">
        <div class="campo">
          <label for="senha">Senha de administrador</label>
          <input id="senha" type="password" required autofocus autocomplete="current-password">
        </div>
        <button class="botao bloco" type="submit" id="btn">Entrar</button>
      </form>
    </div>

    <p class="voltar-site"><a href="/">Voltar para a página de agendamento</a></p>
  </div>

<script>
const form = document.getElementById('formLogin');
const alerta = document.getElementById('alerta');
const btn = document.getElementById('btn');

form.addEventListener('submit', async e => {
  e.preventDefault();
  btn.disabled = true;
  btn.innerHTML = '<span class="carregando"></span>';
  alerta.style.display = 'none';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha: document.getElementById('senha').value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.erro || 'Não foi possível entrar.');
    location.href = '/admin';
  } catch (err) {
    alerta.textContent = err.message;
    alerta.style.display = 'block';
    document.getElementById('senha').select();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
