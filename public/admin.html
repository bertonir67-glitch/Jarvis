<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235f7a6e' stroke-width='1.5'><rect x='3' y='3' width='7' height='9' rx='1'/><rect x='14' y='3' width='7' height='5' rx='1'/><rect x='14' y='12' width='7' height='9' rx='1'/><rect x='3' y='16' width='7' height='5' rx='1'/></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- A fonte escolhida em Ajustes entra aqui pelo JS, sem bloquear a página -->
<link rel="stylesheet" id="fonteWeb" media="print" onload="this.media='all'">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/estilo.css">
<!-- Gerado a partir dos Ajustes do negócio: cores, cantos e fonte -->
<link rel="stylesheet" href="/tema.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<aside class="lateral" id="lateral">
  <div class="lateral-topo">
    <img class="lateral-logo" id="lateralLogo" alt="" hidden>
    <div>
      <strong id="lateralNome">Carregando…</strong>
      <small>Painel do negócio</small>
    </div>
  </div>

  <nav class="menu">
    <span class="menu-grupo">Dia a dia</span>
    <button class="menu-item ativo" data-tela="painel" data-icone="painel">Painel</button>
    <button class="menu-item" data-tela="agenda" data-icone="agenda">Agenda</button>
    <button class="menu-item" data-tela="conversas" data-icone="conversas">Conversas<span class="conta" id="contaConversas"></span></button>
    <button class="menu-item" data-tela="mensagens" data-icone="mensagens">Mensagens<span class="conta" id="contaMensagens"></span></button>
    <button class="menu-item" data-tela="caixa" data-icone="caixa">Caixa</button>

    <span class="menu-grupo">Relacionamento</span>
    <button class="menu-item" data-tela="clientes" data-icone="clientes">Clientes</button>
    <button class="menu-item" data-tela="retencao" data-icone="retencao">Retenção<span class="conta" id="contaRetencao"></span></button>
    <button class="menu-item" data-tela="avaliacoes" data-icone="estrela">Avaliações<span class="conta" id="contaAvaliacoes"></span></button>

    <span class="menu-grupo">Configuração</span>
    <button class="menu-item" data-tela="servicos" data-icone="servicos">Serviços</button>
    <button class="menu-item" data-tela="aparencia" data-icone="aparencia">Aparência</button>
    <button class="menu-item" data-tela="calendario" data-icone="calendario">Calendário</button>
    <button class="menu-item" data-tela="equipe" data-icone="equipe">Equipe</button>
    <button class="menu-item" data-tela="horarios" data-icone="horarios">Horários</button>
    <button class="menu-item" data-tela="ajustes" data-icone="ajustes">Ajustes</button>
  </nav>

  <div class="lateral-rodape">
    <a href="/" target="_blank" rel="noopener" class="menu-item" data-icone="externo">Página do cliente</a>
    <button class="menu-item" id="btnSair" data-icone="sair">Sair</button>
  </div>
</aside>

<div class="sombra-lateral" id="sombraLateral"></div>

<main class="conteudo">
  <header class="barra">
    <button class="menu-hamburguer" id="abrirMenu" aria-label="Abrir menu"></button>
    <div>
      <h1 id="tituloTela">Painel</h1>
      <p class="data-hoje" id="dataHoje"></p>
    </div>
    <div class="barra-acoes" id="barraAcoes"></div>
  </header>

  <div class="telas" id="telas">
    <section class="tela ativa" id="tela-painel"></section>
    <section class="tela" id="tela-agenda"></section>
    <section class="tela" id="tela-conversas"></section>
    <section class="tela" id="tela-mensagens"></section>
    <section class="tela" id="tela-caixa"></section>
    <section class="tela" id="tela-retencao"></section>
    <section class="tela" id="tela-clientes"></section>
    <section class="tela" id="tela-avaliacoes"></section>
    <section class="tela" id="tela-servicos"></section>
    <section class="tela" id="tela-aparencia"></section>
    <section class="tela" id="tela-calendario"></section>
    <section class="tela" id="tela-equipe"></section>
    <section class="tela" id="tela-horarios"></section>
    <section class="tela" id="tela-ajustes"></section>
  </div>
</main>

<div id="recado"></div>

<div class="modal" id="modal">
  <div class="caixa">
    <div class="topo"><h3 id="modalTitulo"></h3><button class="fechar" id="modalFechar" aria-label="Fechar"></button></div>
    <div class="corpo" id="modalCorpo"></div>
    <div class="rodape" id="modalRodape"></div>
  </div>
</div>

<script src="/js/icones.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
