name: Gerar APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Necessário para publicar o release com o APK anexado.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução no gradlew
        run: chmod +x ./gradlew

      # As chaves NÃO são embutidas por padrão — o app pede as três na primeira
      # abertura e guarda no aparelho. Se preferir embutir, cadastre os secrets
      # com estes nomes no repositório e eles entram no build automaticamente.
      - name: Compilar APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renomear o APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/jarvis.apk
          ls -lh dist/

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: dist/jarvis.apk
          if-no-files-found: error

      # Publica também como release, para existir um link direto e permanente
      # para o .apk — sem precisar estar logado no GitHub e sem baixar zip.
      # O link fixo da última versão fica em:
      #   https://github.com/<owner>/<repo>/releases/latest/download/jarvis.apk
      - name: Publicar release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/jarvis.apk \
            --target "${{ github.sha }}" \
            --title "JARVIS — build ${{ github.run_number }}" \
            --notes "APK pronto para instalar. Baixe \`jarvis.apk\` abaixo, transfira para o celular e instale.

          Nenhuma chave de API vai embutida: o app pede a do Gemini e a do Picovoice na primeira abertura e guarda no aparelho." \
            --latest
